# Clean-environment verification.
#
# This workflow deliberately exercises documented install and release paths,
# not just unit tests from an already-prepared developer machine.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    name: ${{ matrix.os }} · python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12"]
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install the documented way
        run: ./scripts/bootstrap.sh

      - name: Run backend suite
        run: |
          set -o pipefail
          ./.venv/bin/python -m pytest -q -rs | tee pytest.out

      - name: Every skip must be accounted for
        run: ./.venv/bin/python scripts/check_test_skips.py pytest.out

  windows-sandbox:
    name: windows · sandbox
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        run: python scripts/manage.py bootstrap

      - name: Verify Windows sandbox confinement
        run: .venv\Scripts\python -m pytest tests/test_sandbox.py -q

  web:
    name: web interface
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  container:
    name: docker build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t throughline-os:ci .

      - name: The API answers in the built image
        run: |
          docker run -d --name throughline -p 127.0.0.1:8080:8080 throughline-os:ci
          cleanup() { docker rm -f throughline >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/api/health >/dev/null 2>&1; then
              echo "healthy"
              exit 0
            fi
            sleep 5
          done
          echo "::error::The API never became healthy."
          docker logs throughline
          exit 1
