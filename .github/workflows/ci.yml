# Clean-environment verification.
#
# This workflow deliberately exercises documented install and release paths,
# not just unit tests from an already-prepared developer machine.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Superseded PR runs may be cancelled, but every main commit must finish.
  # Gate A and Gate B are required to refer to the same exact commit, so
  # cancelling a main run because a later PR merged would erase that evidence.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  suite:
    name: ${{ matrix.os }} · python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12"]
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Verify exact clean checkout
        run: python scripts/verify_pilot_01.py --expected-commit "${{ github.sha }}" --clean-tree

      - name: Install the documented way
        run: ./scripts/bootstrap.sh

      - name: Verify pinned Python runtime
        run: ./.venv/bin/python -c "import sys; assert sys.version_info[:3] == (3, 12, 14), sys.version"

      - name: Run backend suite
        run: |
          set -o pipefail
          ./.venv/bin/python -m pytest -q -rs | tee pytest.out

      - name: Every skip must be accounted for
        run: ./.venv/bin/python scripts/check_test_skips.py pytest.out

  windows-sandbox:
    name: windows · sandbox
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Prepare isolated test home
        shell: pwsh
        run: |
          # pgserver/initdb needs ownership/ACL control of pgdata. GitHub's D:
          # workspace/temp roots refuse that on Windows, while the runner's
          # user profile is owned by runneradmin and is the native supported
          # location. Make it unique per Actions run to preserve clean state.
          $testHome = Join-Path $env:USERPROFILE (".throughline-pilot01-ci-" + $env:GITHUB_RUN_ID)
          "THROUGHLINE_TEST_HOME=$testHome" >> $env:GITHUB_ENV
          "THROUGHLINE_HOME=$testHome" >> $env:GITHUB_ENV

      - name: Verify exact clean checkout and frozen input
        run: python scripts/verify_pilot_01.py --expected-commit "${{ github.sha }}" --clean-tree

      - name: Install
        run: python scripts/manage.py bootstrap

      - name: Verify pinned Python runtime
        run: .venv\Scripts\python -c "import sys; assert sys.version_info[:3] == (3, 12, 14), sys.version"

      - name: Run Pilot Gate A suites on Windows
        run: |
          .venv\Scripts\python scripts/verify_pilot_01.py --expected-commit "${{ github.sha }}" --clean-tree --environment
          .venv\Scripts\python -m pytest tests/test_pilot_01_palmer_penguins.py -q
          .venv\Scripts\python -m pytest tests/test_pilot_02_handoff.py -q

      - name: Verify Windows sandbox confinement
        run: .venv\Scripts\python -m pytest tests/test_sandbox.py -q

  web:
    name: web interface
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  container:
    name: docker build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Build the image
        run: docker build -t throughline-os:ci .

      - name: The API answers in the built image
        run: |
          docker run -d --name throughline -p 127.0.0.1:8080:8080 throughline-os:ci
          cleanup() { docker rm -f throughline >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/api/health >/dev/null 2>&1; then
              echo "healthy"
              exit 0
            fi
            sleep 5
          done
          echo "::error::The API never became healthy."
          docker logs throughline
          exit 1
